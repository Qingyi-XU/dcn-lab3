# Lab 3 - Extra Credit: single-file K8s deployment for the dns_app system.
#
# Deploy with:  kubectl apply -f deploy_dns.yml
#
# Before applying, build and push each image and update the three
# "image:" fields below to point at your own registry, e.g.:
#   docker build -t <your-dockerhub-username>/as:latest ./AS
#   docker build -t <your-dockerhub-username>/fs:latest ./FS
#   docker build -t <your-dockerhub-username>/us:latest ./US
#   docker push <your-dockerhub-username>/as:latest
#   docker push <your-dockerhub-username>/fs:latest
#   docker push <your-dockerhub-username>/us:latest
#
# Per the lab spec, nodePort must be in [30000, 32767]:
#   AS nodePort = 30001 (UDP 53533)
#   FS nodePort = 30002 (TCP 9090)
#   US nodePort = 30003 (TCP 8080)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: as-deployment
  labels:
    app: as
spec:
  replicas: 1
  selector:
    matchLabels:
      app: as
  template:
    metadata:
      labels:
        app: as
    spec:
      containers:
        - name: as
          image: <your-dockerhub-username>/as:latest
          ports:
            - containerPort: 53533
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: as-service
spec:
  type: NodePort
  selector:
    app: as
  ports:
    - port: 53533
      targetPort: 53533
      protocol: UDP
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs-deployment
  labels:
    app: fs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fs
  template:
    metadata:
      labels:
        app: fs
    spec:
      containers:
        - name: fs
          image: <your-dockerhub-username>/fs:latest
          ports:
            - containerPort: 9090
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: fs-service
spec:
  type: NodePort
  selector:
    app: fs
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      nodePort: 30002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: us-deployment
  labels:
    app: us
spec:
  replicas: 1
  selector:
    matchLabels:
      app: us
  template:
    metadata:
      labels:
        app: us
    spec:
      containers:
        - name: us
          image: <your-dockerhub-username>/us:latest
          ports:
            - containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: us-service
spec:
  type: NodePort
  selector:
    app: us
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 30003
